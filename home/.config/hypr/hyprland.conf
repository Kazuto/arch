debug {
  disable_logs = true
}

# === Environment === #
env = GTK_THEME,catppuccin-mocha-pink-standard+default
env = QT_STYLE_OVERRIDE,Adwaita-Dark
env = ELECTRON_ENABLE_FEATURES,WebContentsForceDarkMode
env = GOOGLE_CHROME_EXTRA_FLAGS,--ozone-platform=wayland --enable-features=UseOzonePlatform,WebRTCPipeWireCapturer
env = XDG_DATA_DIRS,$HOME/.local/share:/home/nikmayer/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share/:/usr/share/:/var/lib/snapd/desktop

# === Monitors === #
# Use monitor descriptions (with serial) for persistent identification
# monitor=desc:GIGA-BYTE TECHNOLOGY CO. LTD. GS27QCA 25465B003652,2560x1440@180,0x0,1,transform,1
monitor=desc:GIGA-BYTE TECHNOLOGY CO. LTD. G34WQC A 24142B000602,3440x1440@120,0x640,1
monitor=desc:GIGA-BYTE TECHNOLOGY CO. LTD. GS27QCA 25355B006220,2560x1440@180,3440x0,1,transform,3

# === Status Bar, OSD, Wallpaper === #
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'catppuccin-mocha-pink-standard+default'
exec-once = quickshell
exec = ~/.config/quickshell/scripts/apply-accent.sh --sync
exec-once = wl-paste --watch cliphist store

exec-once = awww-daemon
exec-once = sleep 2 && ~/.config/swww/set-wallpaper.sh "$(find $HOME/Wallpaper/ -maxdepth 1 -type f -iregex '.*\.\(avif\|jpe?g\|png\|webp\|gif\)' | shuf -n 1)"

exec-once = systemctl --user start xdg-desktop-portal-hyprland

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland HYPRLAND_INSTANCE_SIGNATURE DBUS_SESSION_BUS_ADDRESS
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

exec-once = $POLKIT_AUTH_AGENT

exec-once = [workspace 1 silent] firefox 
exec-once = [workspace 2 silent] ghostty
exec-once = [workspace 3 silent] vesktop
exec-once = [workspace 4 silent] steam
exec-once = [workspace 5 silent] proton-mail
exec-once = [workspace 8 silent] spotify

# === Keyboard === #
input {
  follow_mouse = 1
  sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
  numlock_by_default = true

  kb_layout = eu
}

# === Layout === #
general {
  layout = dwindle

  gaps_in=5
  gaps_out=15
  border_size=2

  col.active_border = rgb(fab387) rgb(1e1e2e) rgb(1e1e2e) rgb(fab387) 45deg
  col.inactive_border = rgba(1e1e2eff)
}

# === Misc === #
misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  enable_swallow = true
  swallow_regex = ^(kitty)$
}

# === Decorations === #
decoration {
    rounding = 20
    rounding_power = 10

    active_opacity = 1
    inactive_opacity = 0.85

    blur {
        enabled = true
        size = 5
        passes = 3
        new_optimizations = true
        vibrancy = 0.1696
        ignore_opacity = true
    }

    shadow {
        enabled = false
        range = 20
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

layerrule = match:namespace gtk-layer-shell, blur on
layerrule = match:namespace lockscreen, blur on

# === Animations === #
animations {
  enabled = true

  bezier = overshot, 0.05, 0.9, 0.1, 1.05
  bezier = smoothOut, 0.36, 0, 0.66, -0.56
  bezier = smoothIn, 0.25, 1, 0.5, 1

  animation = windows, 1, 5, overshot, slide
  animation = windowsOut, 1, 4, smoothOut, slide
  animation = windowsMove, 1, 4, default
  animation = border, 1, 10, default
  animation = fade, 1, 10, smoothIn
  animation = workspaces, 1, 6, default

}

# === Layouts === #
dwindle {
  pseudotile = true
  preserve_split = true
}

# === Window rules === #
source = ~/.config/hypr/windowrules.conf

# === Keybinds === #
bind = SUPER, B, exec, chromium
bind = SUPER, T, exec, slack
bind = SUPER, RETURN, exec, ghostty
bind = SUPER, E, exec, thunar
bind = SUPER, Y, exec, ghostty -e yazi

bind = SUPER, C, exec, hyprpicker -a -n

bind = SUPER, R, exec, hyprctl reload; pkill quickshell; quickshell & # Reload Hyprland + Quickshell
bind = SUPER, PERIOD, exec, echo "emoji-toggle" | socat - UNIX-CONNECT:/tmp/quickshell.sock
bind = SUPER, COMMA, exec, echo "wallpaper-toggle" | socat - UNIX-CONNECT:/tmp/quickshell.sock
bind = SUPER SHIFT, W, exec, ~/.config/swww/set-wallpaper.sh "$(find $HOME/Wallpaper/ -maxdepth 1 -type f -iregex '.*\.\(avif\|jpe?g\|png\|webp\|gif\)' | shuf -n 1)"
bind = SUPER, ESCAPE, exec, echo "power-toggle" | socat - UNIX-CONNECT:/tmp/quickshell.sock

bind = SUPER, V, togglefloating,
bind = SUPER, W, killactive,
bind = SUPER, F, exec, ~/.config/hypr/smart-fullscreen.sh
bind = SUPER, Space, exec, echo "launcher-toggle" | socat - UNIX-CONNECT:/tmp/quickshell.sock
bind = SUPER, Q, exec, echo "quick-toggle" | socat - UNIX-CONNECT:/tmp/quickshell.sock
bind = SUPER, SLASH, exec, echo "hotkeys-toggle" | socat - UNIX-CONNECT:/tmp/quickshell.sock

# === Screenshots === # 
$screenshotDir = $(xdg-user-dir PICTURES)/Screenshots

# Screenshots with grimblast - Save to file
bind = SUPER ALT, 2, exec, mkdir -p $screenshotDir && grimblast --notify save screen "$screenshotDir/$(date +'screenshot_%Y%m%d_%H%M%S.png')"
bind = SUPER ALT, 3, exec, mkdir -p $screenshotDir && grimblast --notify save output "$screenshotDir/$(date +'screenshot_%Y%m%d_%H%M%S.png')"
bind = SUPER ALT, 4, exec, mkdir -p $screenshotDir && grimblast --notify save area "$screenshotDir/$(date +'screenshot_%Y%m%d_%H%M%S.png')"
bind = SUPER ALT, 5, exec, mkdir -p $screenshotDir && grimblast --notify --freeze save area "$screenshotDir/$(date +'screenshot_%Y%m%d_%H%M%S.png')"

# Screenshots with grimblast - Copy to clipboard
bind = SUPER CTRL, 2, exec, grimblast --notify copy screen
bind = SUPER CTRL, 3, exec, grimblast --notify copy output
bind = SUPER CTRL, 4, exec, grimblast --notify copy area
bind = SUPER CTRL, 5, exec, grimblast --notify --freeze copy area

# === Other === #

# === Focus === #
# Hyper key (CapsLock) + hjkl = focus (matches Aerospace alt-shift-cmd-ctrl-hjkl)
bind = SUPER, h, movefocus, l
bind = SUPER, j, movefocus, d
bind = SUPER, k, movefocus, u
bind = SUPER, l, movefocus, r

# === Move Windows === #
# SUPER+ALT+hjkl = move window (matches aerospace alt-shift-hjkl)
bind = SUPER ALT, h, movewindow, l
bind = SUPER ALT, j, movewindow, d
bind = SUPER ALT, k, movewindow, u
bind = SUPER ALT, l, movewindow, r

# === Resize Windows === #
# Alt+minus/equal = resize (matches Aerospace alt-minus/equal)
bind = ALT, minus, resizeactive, -50 0
bind = ALT, equal, resizeactive, 50 0
bind = SUPER SHIFT, h, resizeactive, -20 0
bind = SUPER SHIFT, j, resizeactive, 0 -20
bind = SUPER SHIFT, k, resizeactive, 0 20
bind = SUPER SHIFT, l, resizeactive, 20 0

# === Window Groups === #
bind= SUPER, g, togglegroup
bind= SUPER, tab, changegroupactive

# Hyper key (CapsLock) + numbers = switch workspace (matches Aerospace)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Hyper key + left/right = workspace prev/next (matches Aerospace)
# bind = CTRL SHIFT ALT, left, workspace, e-1
# bind = CTRL SHIFT ALT, right, workspace, e+1

# Hyper key + f = fullscreen (matches Aerospace alt-shift-cmd-ctrl-f)
# bind = CTRL SHIFT ALT, f, exec, ~/.config/hypr/smart-fullscreen.sh

# Alt+Tab = workspace back-and-forth (matches Aerospace)
# bind = ALT, tab, workspace, e+1
# bind = ALT SHIFT, tab, workspace, e-1

# === Move to Workspace === #
# Alt+Shift+numbers = move window to workspace (matches Aerospace)
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# === Mouse Binds === #
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# === Audio === #
binde=, XF86AudioRaiseVolume, exec, pamixer -u -i 5 && VOL=$(pamixer --get-volume) && echo "osd-volume:$VOL:unmuted" | socat - UNIX-CONNECT:/tmp/quickshell.sock
binde=, XF86AudioLowerVolume, exec, pamixer -u -d 5 && VOL=$(pamixer --get-volume) && echo "osd-volume:$VOL:unmuted" | socat - UNIX-CONNECT:/tmp/quickshell.sock
bindl=, XF86AudioMute,        exec, pamixer -t && MUTED=$(pamixer --get-mute) && VOL=$(pamixer --get-volume) && echo "osd-volume:$VOL:$([ "$MUTED" = "true" ] && echo muted || echo unmuted)" | socat - UNIX-CONNECT:/tmp/quickshell.sock
bind=,  XF86AudioPlay,        exec, playerctl play-pause
bind=,  XF86AudioPause,       exec, playerctl play-pause
bind=,  XF86AudioNext,        exec, playerctl next
bind=,  XF86AudioPrev,        exec, playerctl previous

# === Brightness === #
binde=, XF86MonBrightnessUp,   exec, brightnessctl set +5% && echo "osd-brightness:$(brightnessctl get | awk -v max=$(brightnessctl max) 'BEGIN{} {printf "%d", ($1/max)*100}')" | socat - UNIX-CONNECT:/tmp/quickshell.sock
binde=, XF86MonBrightnessDown, exec, brightnessctl set 5%- && echo "osd-brightness:$(brightnessctl get | awk -v max=$(brightnessctl max) 'BEGIN{} {printf "%d", ($1/max)*100}')" | socat - UNIX-CONNECT:/tmp/quickshell.sock

# === Workspaces === #
source = ~/.config/hypr/workspaces.conf

# Environment variables
source = ~/.config/hypr/env.conf
