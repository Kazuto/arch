# 3-finger swipe left/right - Switch between desktops/workspaces
gesture swipe left 3 hyprctl dispatch "hl.dsp.focus({ workspace = 'e+1' })"
gesture swipe right 3 hyprctl dispatch "hl.dsp.focus({ workspace = 'e-1' })"

# Alternative gestures
# gesture swipe down 4 hyprctl dispatch "hl.dsp.window.close()"  # Close window
gesture swipe up 4 hyprctl dispatch "hl.dsp.window.fullscreen({ mode = 'maximized' })"   # Toggle fullscreen
