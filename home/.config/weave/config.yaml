# Weave configuration file

branch:
  max_length: 60
  default_type: feature
  types:
    feature: feature
    hotfix: hotfix
    refactor: refactor
    support: support
  sanitization:
    separator: "-"
    lowercase: true
    remove_umlauts: false

commit:
  reference_commits: 5 # Number of recent commits to include as style reference (0 to disable)
  reference_branch: "" # Base branch to compare against (empty = auto-detect main/master)
  types:
    - feat
    - fix
    - docs
    - style
    - refactor
    - perf
    - test
    - chore
    - ci
    - build
  prompt: |-
    Based on the following git diff, generate a commit message in Conventional Commits format.

    Format:
    <type>(<scope>): <short description>

    - <bullet point describing a specific change>
    - <bullet point describing another change>

    Types: {{.Types}}
    Scope: The module/component affected in PascalCase (e.g., CI, API, Auth, Core)

    Recent commit messages for style reference:
    {{.RecentCommits}}

    Rules:
    - First line: type(Scope): Capitalized short description
    - Blank line after the first line
    - IMPORTANT: Use MINIMAL bullet points. One bullet per distinct change.
    - At least one bullet per file change
    - Single file change = 1-3 bullets MAX
    - Never repeat information from the first line
    - Never add filler bullets like "Add necessary configurations" or "Update file structure"
    - Each bullet must describe a UNIQUE, SPECIFIC change
    - Follow the style and conventions from recent commits

    Changed files:
    {{.Files}}

    Git diff:
    {{.Diff}}

    Generate ONLY the commit message, nothing else. Be concise and specific.

pr:
  default_base: ""
  default_remote: ""
  max_diff: 8000
  prompt: |-
    Generate a pull request description for the following changes.

    Branch: {{.Branch}} → {{.Base}}

    Commits:
    {{.Commits}}

    Changed files:
    {{.Files}}

    Diff (truncated):
    {{.Diff}}

    {{if .Template}}Use the following PR template as a structural guide. Fill in each section based on the actual changes:

    {{.Template}}
    {{else}}Format the description as:

    ## Summary
    A concise overview of what this PR does and why.

    ## Changes
    - Bullet points describing specific changes

    ## Test Plan
    - How to verify these changes work correctly
    {{end}}
    Generate ONLY the PR description, nothing else. Be concise and specific.

# LLM provider configuration (shared between commit and PR)
llm:
  provider: openai # Using LM Studio with OpenAI-compatible API

  # OpenAI-compatible configuration (for LM Studio)
  openai:
    model: qwen3.5-2b
    host: http://10.7.2.173:1234 # Removed /v1 - it's added automatically
    api_key: "" # LM Studio doesn't require an API key
    temperature: 0.3
    top_p: 0.9
    max_diff: 4000

  # Ollama configuration (not used when provider is "openai")
  ollama:
    model: llama3.2
    host: http://localhost:11434
    temperature: 0.3
    top_p: 0.9
    max_diff: 4000
